let st='menu',best=0,clk=0,N=0,menuView='main',flash=0,lastBig=false,GEMS=0,OWN=[0],SEL=0,gR=0,tfl=0,skMsg='',skT=0,slidePtr=-1,VIB=true,DIF=1,daily=false,MOD=-1,TUT=false,shopTab=0,stormT=0,seenB=new Set([0]),achT=0,dcDone=false,bests=[0,0,0],O2={cp:[0],tr:[0],pt:[0]},S2={cp:0,tr:0,pt:0},ST={runs:0,m:0,gems:0,bites:0,tot:0,slides:0},ACHD=[],DC={day:0,best:0,done:0},spd=[],pet=null;

const R=a=>Math.random()*a,Mx=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k),C=a=>'rgb('+a.map(Math.round)+')';
function hs(a,b){let h=(a*374761393+b*668265263)^(a*b+1274126177);h=(h^(h>>>13))*1274126177;return (h^(h>>>16))>>>0}
function vn(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return (hs(i,11)%1000/1000)*(1-u)+(hs(i+1,11)%1000/1000)*u}
const BI=[
{n:'Рівнини',top:[104,184,56],dr:[72,140,40],sub:[142,98,58],deep:[112,112,120],sky:[[96,168,255],[196,230,255]],far:[126,168,210],mid:[92,148,118],near:[66,124,70],tr:'oak'},
{n:'Савана',top:[184,180,70],dr:[142,142,52],sub:[158,106,62],deep:[116,110,110],sky:[[104,166,238],[255,228,176]],far:[196,160,150],mid:[172,150,92],near:[146,138,64],tr:'aca'},
{n:'Пустеля',top:[238,216,142],dr:[222,198,120],sub:[226,204,132],deep:[200,176,110],sky:[[92,172,242],[255,238,196]],far:[226,188,142],mid:[214,172,112],near:[204,160,92],tr:'cac'},
{n:'Тайга',top:[246,250,252],dr:[196,214,230],sub:[132,104,76],deep:[108,112,122],sky:[[128,164,214],[222,234,246]],far:[156,174,204],mid:[112,142,152],near:[64,102,92],tr:'spr'},
{n:'Вишневий гай',top:[140,204,104],dr:[108,170,78],sub:[150,104,90],deep:[118,112,124],sky:[[140,176,255],[255,214,234]],far:[214,172,204],mid:[192,152,184],near:[150,196,124],tr:'che'},
{n:'Болото',top:[96,124,56],dr:[66,92,42],sub:[104,80,56],deep:[92,98,96],sky:[[102,132,116],[186,204,160]],far:[120,150,130],mid:[88,120,92],near:[58,90,62],tr:'swa'},
{n:'Нижній світ',top:[160,56,56],dr:[116,34,40],sub:[124,42,46],deep:[74,30,36],sky:[[30,4,10],[132,38,18]],far:[110,28,30],mid:[84,22,28],near:[56,16,22],tr:'net'}];
const BC=BI.map(b=>[0,1,2,3,4,5,6].map(j=>C(j<2?b.sub:j===2?Mx(b.sub,b.deep,.5):b.deep)));
const bi=wx=>MOD===3?6:Math.floor(Math.max(0,wx)/BL)%7;
function nightAmt(){if(MOD===0)return 1;const x=t%60;return x<16?0:x<24?(x-16)/8:x<46?1:x<54?(54-x)/8:0}
function col(a){return C(Mx(Mx(a,[a[0]*.14+5,a[1]*.16+8,a[2]*.3+28],N),[96,106,120],wet*.45))}

let tS=0,tT=0,tFrz=0,tPh=null,portalFl=0,pPh=0,pT=0,exitW=null,pEntW=0,tsd=0;
function addPlat(x,row,wb){const y=280+row*B,q={x,y,w:wb*B,h:H-y,id:nid++,b:bi(dist+x)};sol.push(q);return q}
function gen(){
  const cX=cutX();
  while(lastEnd<W+400&&!(cX!==null&&lastEnd>=cX)){
    const fz=cX!==null&&lastEnd>cX-420;
    const mn=speed<370?3:speed<545?4:5,gap=TUT||fz?0:Math.min(mn+Math.floor(R(diff*3)),6);
    const row=TUT||fz?curRow:Math.max(-1,Math.min(1,curRow+[-1,0,0,1][Math.floor(R(4))]));
    const D=DF[dif()],big=!TUT&&!fz&&D.ph>0&&(stormT>0||(!lastBig&&t>8&&Math.random()<D.ph*(nightAmt()>.4?.6:.2))),spw=!TUT&&!fz&&!big&&dif()===2&&t>10&&Math.random()<.3,wb=big?15:spw?11:3+Math.floor(R(5-diff*2));lastBig=big;
    const gx=lastEnd,pt=280+curRow*B,pl=addPlat(lastEnd+gap*B,row,wb);pl.ph=big;pl.po=R(80)-40;curRow=row;lastEnd+=gap*B+wb*B;addLoot(gx,gap*B,pt,pl);if(spw)spd.push({x:pl.x+pl.w*.8,y:pl.y,a:R(6)});
  }
  if(cX!==null){
    for(const q of sol)if(q.x<cX&&q.x+q.w>cX+B)q.w=Math.ceil((cX-q.x)/B)*B;

    const lq=sol[sol.length-1];if(lq)lastEnd=lq.x+lq.w;
  }

function addLoot(gx,gw,pt,pl){
  const r=Math.random(),top=Math.min(pt,pl.y);
  if(r<.5){for(let k=0;k<3;k++)gems.push({x:gx+gw*(k+1)/4,y:top-[55,82,55][k],a:R(6)})}
  else if(r<.8||pl.ph){const n=pl.ph?5:3,x0=pl.x+pl.w/2-(n-1)*20;for(let k=0;k<n;k++)gems.push({x:x0+k*40,y:pl.y-30-(pl.ph?[0,10,18,10,0][k]:0),a:R(6)})}
  if(!pl.ph&&t>15){const r2=Math.random();if(r2<.05)pups.push({k:'totem',x:pl.x+pl.w/2,y:pl.y-52,a:R(6)});else if(r2<.14)pups.push({k:['mag','x2','slow'][Math.floor(R(3))],x:pl.x+pl.w/2,y:pl.y-52,a:R(6)})}
}
function sparkle(x,y,c){for(let i=0;i<7;i++)dust.push({x,y,vx:R(220)-110,vy:R(220)-130,l:.5,r:2,c})}
function useTotem(fell){
  p.totem=false;p.inv=1.8;tfl=1;SFX.totem();ST.tot++;msg='Тотем врятував тебе!';msgT=2;
  for(let i=0;i<14;i++)dust.push({x:PX+14+R(20)-10,y:p.y+R(50),vx:R(260)-130,vy:R(260)-180,l:.7,r:3,c:'255,215,80'});
  if(fell){
    let q=null;for(const s of sol)if(s.x+s.w>PX+80&&(q===null||s.x<q.x))q=s;
    if(q){
      const sh=q.x-(PX-60);
      if(sh>0){for(const s of sol)s.x-=sh;for(const g of gems)g.x-=sh;for(const g of pups)g.x-=sh;for(const f of ph)f.x-=sh;lastEnd-=sh;dist+=sh;bgx+=sh}
      p.y=q.y-PH;p.vy=0;p.g=true;
    }
  }
}
function reset(){
  sol=[];ph=[];dust=[];spd=[];stormT=0;stormDone=-1;stormOn=false;gTick=0;seenB=new Set([bi(0)]);achT=0;pet=newPet();tS=0;tT=0;tFrz=0;tPh=null;portalFl=0;pPh=0;pT=0;exitW=null;nid=1;t=0;lastBig=false;dist=0;speed=280;diff=0;bgx=0;spawnT=3;curRow=0;msg='';msgT=0;wasNight=false;newBest=false;
  wet=0;rainT=false;rt=20+R(10);curB=bi(0);gems=[];pups=[];gR=0;tfl=0;bw=[0,0,0,0,0,0,0];bw[bi(0)]=1;
  const b=BI[bi(0)];pal={st:b.sky[0],sb:b.sky[1],far:b.far,mid:b.mid,near:b.near};
  p={y:280-PH,vy:0,g:true,coy:0,buf:0,ph:0,ap:0,sq:0,step:0,gb:0,inv:0,totem:false,sl:0,sh:false,sp:0,mag:0,x2:0,slow:0};
  addPlat(-80,0,12);lastEnd=400;gen();
}
function newPet(){return{fy:280,st:'run',pt:0,cd:((PT[S2.pt]||{}).bite||15)/2,f:null,hit:false,cool:0}}
function petUpdate(dt){
  const K=PT[S2.pt];if(!K||!K.k||!pet)return;
  pet.fy+=((p.y+PH)-pet.fy)*Math.min(1,dt*9);
  if(pet.cd>0)pet.cd-=dt;if(pet.cool>0)pet.cool-=dt;
  if(K.k==='spi')return;
  const hx=PX-52;
  if(pet.st==='leap'){
    pet.pt+=dt/.55;
    if(!pet.hit&&pet.pt>=.5){
      pet.hit=true;const f=pet.f;
      if(f&&K.bite&&pet.cd<=0&&!f.dead){f.dead=true;f.dd=0;pet.cd=K.bite;ST.bites++;msg='Улюбленець зловив фантома!';msgT=2;sparkle(f.x,f.y,'255,200,80');SFX.bite()}
      else if(f){sparkle(f.x-8,f.y,'255,255,255');noise(2500,.06,.1,'bandpass')}
    }
    if(pet.pt>=1){pet.st='run';pet.pt=0;pet.f=null;pet.cool=.6}
  }else if(pet.cool<=0){
    const need=K.bite&&pet.cd<=0;
    for(const f of ph){
      if(f.dead||f.x<hx+40||f.x>hx+250)continue;
      if(need&&Math.abs(f.y-(p.y+PH/2))>45)continue;
      pet.st='leap';pet.pt=0;pet.f=f;pet.hit=false;break;
    }
  }
}
function petGame(){
  const K=PT[S2.pt];if(!K||!K.k||!pet||st==='menu')return;
  const hx=PX-(K.k==='spi'?30:52),hy=pet.fy;let x=hx,y=hy,mo=false;
  if(pet.st==='leap'&&pet.f){const e=Math.sin(pet.pt*Math.PI),f=pet.f;x=hx+(f.x-30-hx)*e;y=hy+(f.y+14-hy)*e;mo=pet.pt>.35&&pet.pt<.65}
  petFig(K,x,y,{ph:p.ph,sc:1,air:!p.g||pet.st==='leap',mo});
}
function die(){
  st='dead';deadT=0;SFX.die();TUT=false;try{localStorage.setItem('br_tut','1')}catch(e){}
  const m=M();newBest=false;
  if(daily){if(m>DC.best){DC.best=m;newBest=true}if(m>=300&&!DC.done){DC.done=1;dcDone=true;GEMS+=30}saveDC()}

}
function puffs(n,x,y,sz){for(let i=0;i<n;i++)dust.push({x:x+R(8)-4,y:y-2,vx:-speed*.8-R(60)+(n>4?R(140)-30:0),vy:-10-R(40)*sz,l:.5,r:2+R(2)*sz});if(n>2){const tc=BI[p.gb||0].top.join(',');for(let i=0;i<n+2;i++)dust.push({x:x+R(10)-5,y:y-2,vx:-speed*.5+R(200)-100,vy:-80-R(160),l:.55,r:2,c:tc,sq:1,gr:1})}}
function spawnPh(q,dx,lv){
  const v=speed+170,l=lv==null?[0,0,1,1,2,3][Math.floor(R(6))]:lv;
  ph.push({x:W+260+(dx||0),y:q.y-[16,44,84,130][l],age:0,a:R(6),v});
}
function nextPortalW(){const WB=6*BL,P7=7*BL;return WB+(Math.floor((dist+PX-WB)/P7)+1)*P7}
function cutX(){if(MOD===3||TUT)return null;return (pPh===1?pEntW:nextPortalW())+90-dist}
function portalTeleport(){
  const wP=pEntW;
  if(dist+PX<wP+20){const sh=wP+30-(dist+PX);dist+=sh;bgx+=sh}
  sol=[];gems=[];pups=[];spd=[];ph=[];dust=[];
  const q=addPlat(-120,0,13);q.b=6;
  p.y=280-PH;p.vy=0;p.g=true;p.sl=0;p.sh=false;curRow=0;lastEnd=q.x+q.w;lastBig=false;
  exitW=wP;bw=[0,0,0,0,0,0,1];curB=6;seenB.add(6);
  const b=BI[6];pal={st:b.sky[0],sb:b.sky[1],far:b.far,mid:b.mid,near:b.near};
  msg='Нижній світ!';msgT=2.5;
  gen();
}
function portalStep(r){
  if(!pPh&&!TUT&&MOD!==3&&st==='play'){const wP=nextPortalW();if(wP-(dist+PX)<=60){pPh=1;pT=0;pEntW=wP;SFX.portal()}}
  if(!pPh)return 1;
  pT+=r;
  if(pPh===1){portalFl=Math.min(1,pT/.55);if(pT>=.55){portalTeleport();pPh=2;pT=0}return Math.max(.2,.7-pT*.9)}
  if(pPh===2){portalFl=1;if(pT>=.3){pPh=3;pT=0;SFX.pexit()}return 0}
  portalFl=Math.max(0,1-pT/.8);if(pT>=.8){pPh=0;portalFl=0}return .5+.5*(pT/.8);
}
function tutStep(r){
  tT+=r;
  const cx=PX+14,say=m=>{msg=m;msgT=.3};
  let gy=280;for(const q of sol)if(q.x<=cx&&q.x+q.w>cx){gy=q.y;break}
  const f=tPh&&ph.includes(tPh)?tPh:null;
  const near=()=>f&&f.x>cx&&(f.x-cx)/f.v<=.3,fin=()=>!f||f.x<cx-50;
  const mk=dy=>{tPh={x:W+20,y:gy-dy,age:0,a:1,v:speed+170};ph.push(tPh)};
  switch(tS){
  case 0:say('Привіт, Стіве! Біжи вперед і збирай алмази');if(tT>3.5){tS=1;tT=0}return .3;
  case 1:say('Летить фантом! Його треба перестрибнути');if(tT>3.5){tS=2;tT=0;mk(16)}return .3;
  case 2:say('Тапни по екрану або натисни пробіл — стрибок!');if(near()){tFrz='jump';tS=3}return .3;
  case 3:if(tFrz){say('Стрибай! Тапни по екрану або пробіл');return 0}say('Чудово!');if(fin()){tS=4;tT=0}return 1;
  case 4:say('Молодець! Тепер фантом на рівні голови — пройди присівши');if(tT>3.8){tS=5;tT=0;mk(44)}return .3;
  case 5:say('Присядь: тримай кнопку ліворуч внизу або клавішу S');if(near()){tFrz='slide';tS=6}return .3;
  case 6:if(tFrz){say('Присядь зараз! Кнопка ліворуч внизу або S');return 0}say('Супер!');if(fin()){tS=7;tT=0;for(let k=0;k<5;k++)gems.push({x:W+60+k*40,y:gy-30,a:k})}return 1;
  case 7:say('Збирай алмази — за них купуєш скіни та улюбленців');if(tT>3){tS=8;tT=0}return .6;
  case 8:say('Червоний знак ! — летить фантом. Удачі!');if(tT>2.8){TUT=false;try{localStorage.setItem('br_tut','1')}catch(e){}}return .6;
  }
  return 1;
}
function update(dt){
  const rdt=dt;if(TUT)dt*=tutStep(rdt);dt*=portalStep(rdt);if(p.slow>0)dt*=.65;
  t+=dt;diff=Math.min(1,t/DF[dif()].rt);speed=(270+260*diff)*DF[dif()].sp*(MOD===1?1.1:MOD===4?1.25:1)*(PT[S2.pt].sp||1);
  const dx=speed*dt;dist+=dx;bgx+=dx;lastEnd-=dx;p.ph+=dt*speed*.028;
  for(const s of sol)s.x-=dx;
  sol=sol.filter(s=>s.x+s.w>-60);gen();
  p.buf-=dt;p.coy-=dt;if(p.g)p.coy=.12;
  if(p.buf>0&&p.coy>0){p.vy=-640;p.g=false;p.coy=0;p.buf=0;p.sl=0;puffs(3,PX+10,p.y+PH,.6);SFX.jump()}
  const pb=p.y+PH,px=PX+3,wasG=p.g,vyb=p.vy+1900*dt,hh=p.sl>0?24:PH;
  p.vy=vyb;p.y+=p.vy*dt;p.g=false;
  let dead=false;
  for(const s of sol){
    if(px<s.x+s.w&&px+PW>s.x&&p.y<s.y+s.h&&p.y+PH>s.y){
      if(pb<=s.y+20&&p.vy>=0){p.y=s.y-PH;p.vy=0;p.g=true;p.gb=s.b}else if(p.inv>0){p.y=s.y-PH;p.vy=0;p.g=true;p.gb=s.b}else dead=true;
    }
  }
  if(p.g&&!wasG&&vyb>250){p.sq=Math.min(.24,vyb/3200);puffs(8,PX+12,p.y+PH,1);SFX.land(vyb)}
  p.sq*=Math.exp(-dt*12);
  const stp=Math.floor(p.ph/Math.PI);if(stp!==p.step){p.step=stp;if(p.g){puffs(1,PX+4,p.y+PH,.5);SFX.step(p.gb)}}
  p.ap+=((p.g?0:1)-p.ap)*Math.min(1,dt*16);
  if(p.sh&&p.g&&p.sl<.1)p.sl=.1;
  p.sl=Math.max(0,p.sl-dt);p.sp+=((p.sl>0?1:0)-p.sp)*Math.min(1,dt*20);
  if(p.sl>0&&p.g&&Math.random()<dt*40)puffs(1,PX+6,p.y+PH,.6);
  p.inv=Math.max(0,p.inv-dt);tfl=Math.max(0,tfl-dt*2);p.mag=Math.max(0,p.mag-rdt);p.x2=Math.max(0,p.x2-rdt);p.slow=Math.max(0,p.slow-rdt);

// ---------- керування ----------
function start(){daily=false;MOD=-1;reset();st='play'}
function startDaily(){daily=true;MOD=DM;reset();st='play'}
function pauseGame(){if(st==='play')st='pause'}
function resumeGame(){if(st==='pause')st='play'}
function press(){au();
  if(st==='menu'){if(menuView!=='main')menuView='main';else start()}
  else if(st==='dead'){if(deadT>.5){daily?startDaily():start()}}
  else{if(tFrz==='slide')return;if(tFrz==='jump')tFrz=0;p.buf=.15}
}
function release(){if(st==='play'&&!p.g&&p.vy<-380)p.vy=-380}
function startSlide(){if(st!=='play'||tFrz==='jump')return;if(tFrz==='slide')tFrz=0;p.sh=true;if(p.g){if(p.sl<=0)ST.slides++;p.sl=.5}else p.vy=Math.max(p.vy,760)}
function endSlide(){if(p)p.sh=false}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW','Enter'].includes(e.code)){e.preventDefault();if(!e.repeat)press()}
});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))release()});
const MB=[{id:'play',y:102},{id:'daily',y:140},{id:'shop',y:178},{id:'quests',y:216},{id:'set',y:254},{id:'help',y:292}];
const DB=[0,1,2].map(i=>({i,x:240+i*110,y:58,w:100,h:30})),DLB=['Спокійно','Звичайно','Важко'],DLC=['#8ff0a8','#ffe45c','#ff8a7a'];
function savePrefs(){try{localStorage.setItem('br_mute',MUTE?'1':'0');localStorage.setItem('br_mus',MUSOFF?'1':'0');localStorage.setItem('br_vib',VIB?'1':'0');localStorage.setItem('br_dif',DIF)}catch(e){}}
function toggleMute(){const off=MUTE&&MUSOFF;MUTE=MUSOFF=!off;savePrefs()}
function menuWorld(){daily=false;MOD=-1;reset();sol=[];gems=[];pups=[];lastEnd=-80;t=0;st='menu';menuView='main'}
function menuClick(x,y){
  const inB=(bx,by,w,h)=>x>=bx&&x<=bx+w&&y>=by&&y<=by+h;
  if(menuView==='help'){if(inB(240,340,320,36))menuView='main';return}
  if(menuView==='quests'){if(inB(240,376,320,36))menuView='main';return}
  if(menuView==='set'){
    if(inB(240,130,320,36)){MUSOFF=!MUSOFF;savePrefs()}
    else if(inB(240,172,320,36)){MUTE=!MUTE;savePrefs();SFX.chime()}
    else if(inB(240,214,320,36)){VIB=!VIB;savePrefs();SFX.vib(40)}
    else if(inB(240,256,320,36)){DIF=(DIF+1)%3;savePrefs();SFX.chime()}
    else if(inB(240,320,320,36))menuView='main';
    return;
  }
  if(menuView==='shop'){
    if(inB(240,386,320,34)){menuView='main';return}
    const T=tabs();
    T.forEach((tt,i)=>{if(inB(84+i*134,38,128,30)){shopTab=i;SFX.chime()}});
    const Tb=T[shopTab],k=Tb.k;
    Tb.a.forEach((it,i)=>{
      const x0=100+(i%3)*210,y0=82+Math.floor(i/3)*146;
      if(inB(x0,y0,190,134)){
        if(own(k).includes(i)){setSel(k,i);saveG();SFX.chime()}
        else if(GEMS>=it.c){GEMS-=it.c;own(k).push(i);setSel(k,i);saveG();SFX.gem();SFX.chime();chkAch()}
        else{skMsg='Не вистачає алмазів';skT=clk+1.6;SFX.deny()}
      }
    });
    return;
  }
  for(const d of DB)if(inB(d.x,d.y,d.w,d.h)){DIF=d.i;savePrefs();SFX.chime();return}
  for(const m of MB)if(inB(240,m.y,320,34)){
    if(m.id==='play')start();
    else if(m.id==='daily')startDaily();
    else if(m.id==='shop')menuView='shop';
    else if(m.id==='quests')menuView='quests';
    else if(m.id==='set')menuView='set';
    else menuView='help';
    return;
  }
}
addEventListener('keydown',e=>{if(e.code==='KeyM')toggleMute();if(e.code==='Escape'||e.code==='KeyP'){if(st==='play')pauseGame();else if(st==='pause')resumeGame();else if(st==='dead')menuWorld()}if((e.code==='ArrowDown'||e.code==='KeyS')&&!e.repeat){e.preventDefault();startSlide()}});
addEventListener('keyup',e=>{if(e.code==='ArrowDown'||e.code==='KeyS')endSlide()});
addEventListener('pointerdown',e=>{
  e.preventDefault();au();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(st==='menu'){menuClick(x,y);return}
  if(st==='pause'){if(x>=240&&x<=560){if(y>=160&&y<=196)resumeGame();else if(y>=206&&y<=242)menuWorld()}return}
  if(st==='play'&&x>W/2-26&&x<W/2+26&&y<44){pauseGame();return}
  if(st==='play'&&x<120&&y>H-120){slidePtr=e.pointerId;startSlide();return}
  if(x>W-52&&y>46&&y<80){toggleMute();return}
  if(st==='dead'&&deadT>.3&&x>W/2-110&&x<W/2+110&&y>296&&y<330){menuWorld();return}
  press();
});
const pu=e=>{if(e.pointerId===slidePtr){slidePtr=-1;endSlide();return}release()};
addEventListener('pointerup',pu);addEventListener('pointercancel',pu);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});

function menuUpdate(dt){
  t+=dt*.5;const dx=120*dt;bgx+=dx;dist+=dx;lastEnd-=dx;p.ph+=dt*150*.028;
  for(const x of sol)x.x-=dx;
  sol=sol.filter(x=>x.x+x.w>-60);
  while(lastEnd<W+150){addPlat(lastEnd,0,5+Math.floor(R(4)));lastEnd+=sol[sol.length-1].w}
  for(let i=0;i<7;i++)bw[i]+=((i===bi(dist+PX)?1:0)-bw[i])*Math.min(1,dt*1.2);
  const tb=BI[bi(dist+PX)],tg={st:tb.sky[0],sb:tb.sky[1],far:tb.far,mid:tb.mid,near:tb.near};
  for(const k in tg)pal[k]=Mx(pal[k],tg[k],Math.min(1,dt*1.2));
}
buildTiles();
menuWorld();
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;clk=now/1000;
  if(st==='play')update(dt);else if(st==='dead')deadT+=dt;else if(st==='menu')menuUpdate(dt);
  if(musG){const mv=MUSOFF?0:(st==='play'?.5:.35);musG.gain.setTargetAtTime(mv,AC.currentTime,.4);musD.gain.setTargetAtTime(mv,AC.currentTime,.4)}
  draw();if(st!=='menu')spk();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
