name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Підготувати проєкт Android
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done || true
          test -f index.html || { echo "У репозиторії немає index.html"; exit 1; }
          P=app/src/main
          mkdir -p $P/java/com/darcmer/blockrunner $P/assets $P/res/mipmap-xxxhdpi
          cp index.html $P/assets/index.html
          cp icon-512.png $P/res/mipmap-xxxhdpi/ic_launcher.png
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'BlockRunner'
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.5.2' apply false }" > build.gradle
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.darcmer.blockrunner'
            compileSdk 34
            defaultConfig { applicationId 'com.darcmer.blockrunner'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
          }
          EOF
          cat > $P/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Block Runner" android:icon="@mipmap/ic_launcher" android:hardwareAccelerated="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="sensorLandscape"
                  android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > $P/java/com/darcmer/blockrunner/MainActivity.java <<'EOF'
          package com.darcmer.blockrunner;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient());
              w.setWebChromeClient(new WebChromeClient());
              w.loadUrl("file:///android_asset/index.html");
              hide();
            }
            void hide() {
              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
            }
            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hide(); }
            @Override protected void onPause() { super.onPause(); w.onPause(); }
            @Override protected void onResume() { super.onResume(); w.onResume(); }
          }
          EOF
      - name: Зібрати APK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          gradle assembleDebug --no-daemon
      - name: Опублікувати APK у Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk block-runner.apk
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest block-runner.apk --title "Block Runner APK" --notes "Завантажте block-runner.apk, відкрийте його й встановіть."
