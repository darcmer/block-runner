name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare files
        run: |
          mkdir -p www assets
          cp index.html manifest.json sw.js www/
          cp icon-192.png icon-512.png www/ || true
          cp icon-only.png icon-foreground.png icon-background.png assets/ || true
          ls -la www assets

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons
        run: |
          if [ -f assets/icon-only.png ]; then
            npx capacitor-assets generate --android --assetPath assets
          else
            echo "No icons, using default"
          fi

      - name: Landscape + fullscreen
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name="\.MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' $MAN
          STY=android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>' $STY
          mkdir -p android/app/src/main/java/com/blockrunner/game
          cp MainActivity.java android/app/src/main/java/com/blockrunner/game/MainActivity.java

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BlockRunner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockRunner-apk
          path: BlockRunner.apk

      - name: Publish Release (only on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BlockRunner.apk
